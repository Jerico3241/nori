name: Build Android

# Werkstattlauf für die Android-App. Erhebt, welche Werkzeuge auf welchem
# Runner tatsächlich vorhanden sind — GitHub-gehostetes Ubuntu bringt das
# Android-SDK mit, der self-hosted Mac das Swift-SDK für den Kern.
on:
  workflow_dispatch:
  push:
    paths:
      - 'native/Nori-Android/**'
      - 'native/NoriCore/**'
      - 'native/Package.swift'
      - '.github/workflows/build-android-app.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosted:
    name: Ubuntu (gehostet)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - name: Umgebung erheben
        run: |
          echo "== java =="; java -version 2>&1 || true
          echo "== ANDROID_HOME=$ANDROID_HOME =="
          ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "keine platforms"
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || echo "keine build-tools"
          ls "$ANDROID_HOME/ndk" 2>/dev/null || echo "kein ndk"
          curl -sS -o /dev/null -w 'download.swift.org: %{http_code}\n' https://download.swift.org/ || true
          df -h / | tail -1; nproc

  mac:
    name: Self-hosted Mac
    runs-on: [self-hosted, macOS]
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - name: Umgebung erheben
        run: |
          echo "== swift =="; swift --version 2>&1 || true
          echo "== swift sdk list =="; swift sdk list 2>&1 || true
          echo "== toolchains =="
          ls ~/Library/Developer/Toolchains /Library/Developer/Toolchains 2>/dev/null || true
          echo "== java =="; java -version 2>&1 || echo "kein java"
          echo "== android sdk =="
          ls "$ANDROID_HOME" 2>/dev/null || echo "ANDROID_HOME leer: $ANDROID_HOME"
          ls ~/Library/Android/sdk 2>/dev/null || echo "kein ~/Library/Android/sdk"
          echo "== ndk =="; ls ~/Library/Android/sdk/ndk 2>/dev/null || true
          echo "== platz =="; df -h / | tail -1

name: Build Android core

# Bewusst **nur** von Hand auslösbar, nicht bei `push`.
#
# Der Lauf braucht ein Swift-SDK für Android auf dem Runner (siehe
# docs/android.md). Solange das nicht eingerichtet ist, würde ein
# push-Auslöser jeden Pull Request rot färben, obwohl am Quelltext nichts
# falsch ist. Sobald das SDK steht, kann der Auslöser hier auf
# `native/Nori-macOS/Nori/**` erweitert werden — dann prüft er bei jeder
# Änderung am geteilten Kern mit.
on:
  workflow_dispatch:
    inputs:
      sdk:
        description: 'Bezeichner des Swift-SDK (leer = automatisch suchen)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Die Reihenfolge ist hier wichtig und war einmal andersherum: Erst das
      # SDK bestimmen, daraus die Toolchain wählen — und **danach** prüfen.
      # Das Prüfskript vergleicht inzwischen die Toolchain-Version mit dem SDK,
      # und ohne gesetztes TOOLCHAINS sähe es die aus Xcode und bräche ab,
      # obwohl die richtige Toolchain daneben liegt.
      - name: SDK-Bezeichner bestimmen
        id: sdk
        run: |
          set -euo pipefail
          CHOSEN="${{ inputs.sdk }}"
          if [ -z "$CHOSEN" ]; then
              CHOSEN="$(swift sdk list | grep -i android | head -1 | tr -d '[:space:]')"
          fi
          if [ -z "$CHOSEN" ]; then
              echo "::error::Kein Android-SDK-Bezeichner ermittelbar."
              exit 1
          fi
          echo "Verwende: $CHOSEN"
          echo "id=$CHOSEN" >> "$GITHUB_OUTPUT"

      # Nicht die Toolchain aus Xcode.
      #
      # Ein Cross-Compilation-SDK verlangt die Open-Source-Toolchain von
      # swift.org in **exakt** derselben Version. Auf dem Runner ist `swift`
      # aber die aus Xcode, und die baut zwar los, scheitert dann jedoch an
      # dutzenden Fehlern, die nach kaputtem Quelltext aussehen. Ausgewählt
      # wird über TOOLCHAINS; der Bezeichner steht in der Info.plist.
      #
      # In GITHUB_ENV statt in GITHUB_OUTPUT, damit auch das Prüfskript im
      # nächsten Schritt dieselbe Toolchain sieht wie der Build.
      - name: Toolchain zum SDK auswählen
        run: |
          set -euo pipefail
          VERSION="${{ steps.sdk.outputs.id }}"
          VERSION="${VERSION#swift-}"
          VERSION="${VERSION%%-RELEASE*}"
          for dir in "$HOME/Library/Developer/Toolchains" /Library/Developer/Toolchains; do
              PLIST="$dir/swift-$VERSION-RELEASE.xctoolchain/Info.plist"
              if [ -f "$PLIST" ]; then
                  ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")"
                  echo "Toolchain $VERSION: $ID"
                  echo "TOOLCHAINS=$ID" >> "$GITHUB_ENV"
                  exit 0
              fi
          done
          echo "::error::Keine Open-Source-Toolchain $VERSION gefunden."
          echo "  Erwartet: swift-$VERSION-RELEASE.xctoolchain unter ~/Library/Developer/Toolchains" >&2
          echo "  Zu laden von https://www.swift.org/install/macos/ — siehe docs/android.md." >&2
          exit 1

      # Erst die Werkzeuge, dann bauen — dieselbe Lehre wie bei den
      # Apple-Läufen: ein fehlendes SDK sieht sonst aus wie ein Fehler im
      # Quelltext.
      - name: Toolchain prüfen
        run: tools/require-swift-android.sh

      # Gebaut wird ausschließlich `NoriCore` — die fünf byte-gleichen
      # Dateien. Views, Player und App-Einstiegspunkt sind SwiftUI und haben
      # auf Android nichts zu suchen; die Oberfläche wird Compose.
      #
      # Das ist der eigentliche Beweis: übersetzen SwiftSoup, Observation und
      # Foundation für Android durch, ist der geteilte Kern tragfähig.
      - name: NoriCore für Android bauen
        working-directory: native
        run: |
          set -o pipefail
          swift build \
            --target NoriCore \
            --swift-sdk "${{ steps.sdk.outputs.id }}" \
            2>&1 | tee "$RUNNER_TEMP/nori-android-build.log"

      - name: Build-Log bei Fehlschlag hochladen
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: nori-android-build-log
          path: ${{ runner.temp }}/nori-android-build.log
          if-no-files-found: ignore
          retention-days: 3

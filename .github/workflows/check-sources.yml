name: Check Apple sources

# Nur `push`, kein `pull_request`: Für Branches in diesem Repository laufen
# beide Ereignisse auf demselben Baum — der Zweig sitzt auf main auf, der
# Merge-Commit ist der Branch-Kopf. Das prüfte alles doppelt und kostete die
# doppelten Minuten. GitHub ordnet die push-Läufe dem Pull Request ohnehin zu,
# sie erscheinen dort also weiterhin als Prüfungen.
on:
  push:
    # Nur Branches: ein Release-Tag startet keinen Lauf.
    branches: ['**']
    paths:
      - 'native/**'
      - 'tools/check-apple-sources.py'
      - 'tools/configure-google-oauth.py'
      - 'tools/test_configure_google_oauth.py'
      - '.github/workflows/check-sources.yml'
      # check-apple-sources.py liest diese beiden und prüft Xcode-Anforderung
      # und die Google-Schritte des IPA-Jobs.
      - '.github/workflows/build-ios.yml'
      - '.github/workflows/build-macos.yml'
  workflow_dispatch:

# Läuft auf dem self-hosted Runner (ein Mac). Der verbraucht keine
# GitHub-Minuten — bei einem privaten Repository zählt eine macOS-Minute sonst
# zehnfach, und genau daran war das Kontingent aufgebraucht.
#
# Folgen davon: der Mac muss an und online sein, sonst warten die Jobs. Und es
# gibt nur einen Runner, die Jobs laufen also nacheinander — deshalb die
# concurrency-Gruppe, die überholte Läufe abbricht, statt sie abzuarbeiten.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check iOS/macOS source parity
        run: python3 tools/check-apple-sources.py

      - name: iOS-Paket ohne Google-Client-ID abweisen
        run: python3 tools/test_configure_google_oauth.py

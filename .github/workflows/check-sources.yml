name: Check Apple sources

# Nur `push`, kein `pull_request`: Für Branches in diesem Repository laufen
# beide Ereignisse auf demselben Baum — der Zweig sitzt auf main auf, der
# Merge-Commit ist der Branch-Kopf. Das prüfte alles doppelt und kostete die
# doppelten Minuten. GitHub ordnet die push-Läufe dem Pull Request ohnehin zu,
# sie erscheinen dort also weiterhin als Prüfungen.
on:
  push:
    paths:
      - 'native/**'
      - 'tools/check-apple-sources.py'
      - '.github/workflows/check-sources.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check iOS/macOS source parity
        run: python3 tools/check-apple-sources.py

name: Build macOS

on:
  push:
    paths:
      - 'native/Nori-macOS/**'
      - 'native/NoriCore/**'
      - 'tools/require-xcode.sh'
      - '.github/workflows/build-macos.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Toolchain prüfen
        run: tools/require-xcode.sh 26

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project native/Nori-macOS/NoriMac.xcodeproj \
            -scheme Nori

      - name: Build Nori for macOS
        run: |
          set -o pipefail
          xcodebuild \
            -project native/Nori-macOS/NoriMac.xcodeproj \
            -scheme Nori \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/NoriDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee "$RUNNER_TEMP/nori-xcodebuild.log"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: nori-macos-xcodebuild-log
          path: ${{ runner.temp }}/nori-xcodebuild.log
          if-no-files-found: ignore

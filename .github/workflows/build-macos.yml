name: Build macOS

on:
  push:
    paths:
      - 'native/Nori-macOS/**'
      - '.github/workflows/build-macos.yml'
  workflow_dispatch:

# Läuft auf dem self-hosted Runner (ein Mac). Der verbraucht keine
# GitHub-Minuten — bei einem privaten Repository zählt eine macOS-Minute sonst
# zehnfach, und genau daran war das Kontingent aufgebraucht.
#
# Folgen davon: der Mac muss an und online sein, sonst warten die Jobs. Und es
# gibt nur einen Runner, die Jobs laufen also nacheinander — deshalb die
# concurrency-Gruppe, die überholte Läufe abbricht, statt sie abzuarbeiten.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Xcode 15 bringt das macOS-14-SDK mit, das dieses Target braucht. Die
      # Prüfung sagt bei einem frisch aufgesetzten Runner, was fehlt — sonst
      # bricht der erste xcodebuild-Aufruf nur mit „requires Xcode, but active
      # developer directory … is a command line tools instance" ab.
      - name: Toolchain prüfen
        run: tools/require-xcode.sh 15

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project native/Nori-macOS/NoriMac.xcodeproj \
            -scheme Nori

      - name: Build Nori for macOS
        run: |
          set -o pipefail
          xcodebuild \
            -project native/Nori-macOS/NoriMac.xcodeproj \
            -scheme Nori \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/NoriDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee "$RUNNER_TEMP/nori-xcodebuild.log"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: nori-macos-xcodebuild-log
          path: ${{ runner.temp }}/nori-xcodebuild.log
          if-no-files-found: ignore

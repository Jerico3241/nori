name: Build macOS

on:
  push:
    paths:
      - 'native/Nori-macOS/**'
      - '.github/workflows/build-macos.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project native/Nori-macOS/NoriMac.xcodeproj \
            -scheme Nori

      - name: Build Nori for macOS
        run: |
          set -o pipefail
          xcodebuild \
            -project native/Nori-macOS/NoriMac.xcodeproj \
            -scheme Nori \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/NoriDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee "$RUNNER_TEMP/nori-xcodebuild.log"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nori-macos-xcodebuild-log
          path: ${{ runner.temp }}/nori-xcodebuild.log
          if-no-files-found: ignore

name: Package macOS Source

# Zwischenstand von main als Quellpaket — praktisch, um kurz etwas
# auszuprobieren. Das dauerhafte Paket entsteht im Release-Workflow aus einem
# Tag; dieses hier verfällt nach 30 Tagen.
on:
  push:
    branches: [main]
    paths:
      - 'native/Nori-macOS/**'
      - '.github/workflows/package-macos-source.yml'
  workflow_dispatch:

permissions:
  contents: read

# Läuft auf dem self-hosted Runner (ein Mac). Der verbraucht keine
# GitHub-Minuten — bei einem privaten Repository zählt eine macOS-Minute sonst
# zehnfach, und genau daran war das Kontingent aufgebraucht.
#
# Folgen davon: der Mac muss an und online sein, sonst warten die Jobs. Und es
# gibt nur einen Runner, die Jobs laufen also nacheinander — deshalb die
# concurrency-Gruppe, die überholte Läufe abbricht, statt sie abzuarbeiten.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: [self-hosted, macOS]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Der Name trug bisher keine Version. Wer zwei Pakete nebeneinander
      # liegen hatte, konnte nicht sagen, welches welches ist.
      - name: Version lesen
        id: meta
        run: |
          set -euo pipefail
          VERSION="$(grep -oE 'MARKETING_VERSION = [0-9.]+' \
            native/Nori-macOS/NoriMac.xcodeproj/project.pbxproj | head -1 | awk '{print $3}')"
          test -n "$VERSION"
          echo "name=Nori-macOS-$VERSION-source" >> "$GITHUB_OUTPUT"

      - name: Create macOS source package
        run: |
          ditto -c -k --sequesterRsrc --keepParent native/Nori-macOS \
            "${{ steps.meta.outputs.name }}.zip"

      - name: Upload package
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.meta.outputs.name }}
          path: ${{ steps.meta.outputs.name }}.zip
          if-no-files-found: error
          retention-days: 30

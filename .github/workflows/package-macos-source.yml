name: Package macOS Source

on:
  push:
    branches: [main]
    paths:
      - 'native/Nori-macOS/**'
      - 'native/NoriCore/**'
      - 'native/Package.swift'
      - 'native/Tests/**'
      - 'config/contract.json'
      - '.github/workflows/package-macos-source.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: [self-hosted, macOS]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Version lesen
        id: meta
        run: |
          set -euo pipefail
          VERSION="$(grep -oE 'MARKETING_VERSION = [0-9.]+' \
            native/Nori-macOS/NoriMac.xcodeproj/project.pbxproj | head -1 | awk '{print $3}')"
          test -n "$VERSION"
          echo "name=Nori-macOS-$VERSION-source" >> "$GITHUB_OUTPUT"

      - name: Create macOS source package
        run: |
          set -euo pipefail
          zip -r -y -q "${{ steps.meta.outputs.name }}.zip" \
            native/Nori-macOS \
            native/NoriCore \
            native/Package.swift \
            native/Tests \
            config/contract.json \
            README.md \
            CHANGELOG.md
          unzip -l "${{ steps.meta.outputs.name }}.zip" | tail -1

      - name: Upload package
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.meta.outputs.name }}
          path: ${{ steps.meta.outputs.name }}.zip
          if-no-files-found: error
          retention-days: 30

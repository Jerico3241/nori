name: Package macOS Source

on:
  push:
    branches: [main]
    paths:
      - 'native/Nori-macOS/**'
      - 'native/NoriCore/**'
      - 'native/Package.swift'
      - 'native/Tests/**'
      - 'config/contract.json'
      - '.github/workflows/package-macos-source.yml'
      - '.github/workflows/release.yml'
      - 'tools/nori-release.py'
  workflow_dispatch:

permissions:
  contents: read

# Auf main wird ein laufender Lauf nicht abgebrochen: sein letzter Job legt den
# GitHub-Release an und soll nie mittendrin enden.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  package:
    runs-on: [self-hosted, macOS]
    outputs:
      artifact: ${{ steps.meta.outputs.name }}
      sha256: ${{ steps.release-check.outputs.sha256 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Version lesen
        id: meta
        run: |
          set -euo pipefail
          VERSION="$(grep -oE 'MARKETING_VERSION = [0-9.]+' \
            native/Nori-macOS/NoriMac.xcodeproj/project.pbxproj | head -1 | awk '{print $3}')"
          test -n "$VERSION"
          echo "name=Nori-macOS-$VERSION-source" >> "$GITHUB_OUTPUT"

      # Solange es kein signiertes macOS-Programm gibt, ist das Quellpaket das
      # veröffentlichte Paket. Eine lokale Google-Konfiguration darf nie hinein.
      - name: Create macOS source package
        run: |
          set -euo pipefail
          zip -r -y -q "${{ steps.meta.outputs.name }}.zip" \
            native/Nori-macOS \
            native/NoriCore \
            native/Package.swift \
            native/Tests \
            config/contract.json \
            README.md \
            CHANGELOG.md \
            -x '*/Config/*.local.xcconfig' '*.env.local' '*oauth*.json' 'client_secret*.json'
          unzip -l "${{ steps.meta.outputs.name }}.zip" | tail -1

      # Jede Datei im Paket ist Byte für Byte die des Commits — keine
      # zusätzliche, keine fehlende, keine lokal veränderte — und die Version
      # stimmt. Der Release-Job veröffentlicht nur ein Paket mit derselben
      # Prüfsumme.
      - name: Quellpaket prüfen
        id: release-check
        run: python3 tools/nori-release.py verify --platform macos --file "${{ steps.meta.outputs.name }}.zip" --github-output

      - name: Upload package
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.meta.outputs.name }}
          path: ${{ steps.meta.outputs.name }}.zip
          if-no-files-found: error
          retention-days: 7

      - name: Quellpaket aus dem Checkout entfernen
        if: always()
        run: rm -f Nori-macOS-*-source.zip

  # GitHub-Release `macos-v<VERSION>` mit genau dem geprüften Quellpaket — nur
  # auf main, nur nach einem grünen Paket-Job. Gibt es den Release schon, endet
  # er grün.
  release:
    needs: package
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      platform: macos
      artifact: ${{ needs.package.outputs.artifact }}
      sha256: ${{ needs.package.outputs.sha256 }}

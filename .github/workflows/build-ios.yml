name: Build iOS

on:
  push:
    paths:
      - 'native/Nori-iOS/**'
      - '.github/workflows/build-ios.yml'
  pull_request:
    paths:
      - 'native/Nori-iOS/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project native/Nori-iOS/Nori.xcodeproj \
            -scheme Nori

      # Gegen den Simulator bauen: dafür wird keine Signatur gebraucht, und
      # der Typechecker läuft trotzdem über den gesamten iOS-Code.
      - name: Build Nori for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project native/Nori-iOS/Nori.xcodeproj \
            -scheme Nori \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/NoriIOSDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee "$RUNNER_TEMP/nori-ios-xcodebuild.log"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: nori-ios-xcodebuild-log
          path: ${{ runner.temp }}/nori-ios-xcodebuild.log
          if-no-files-found: ignore

name: Build iOS

# Nur `push`, kein `pull_request`: Für Branches in diesem Repository laufen
# beide Ereignisse auf demselben Baum — der Zweig sitzt auf main auf, der
# Merge-Commit ist der Branch-Kopf. Das prüfte alles doppelt und kostete die
# doppelten Minuten. GitHub ordnet die push-Läufe dem Pull Request ohnehin zu,
# sie erscheinen dort also weiterhin als Prüfungen.
on:
  push:
    paths:
      - 'native/Nori-iOS/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

# Läuft auf dem self-hosted Runner (ein Mac). Der verbraucht keine
# GitHub-Minuten — bei einem privaten Repository zählt eine macOS-Minute sonst
# zehnfach, und genau daran war das Kontingent aufgebraucht.
#
# Folgen davon: der Mac muss an und online sein, sonst warten die Jobs. Und es
# gibt nur einen Runner, die Jobs laufen also nacheinander — deshalb die
# concurrency-Gruppe, die überholte Läufe abbricht, statt sie abzuarbeiten.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Der Runner braucht mindestens Xcode 16: die App nutzt hinter
      # `#available(iOS 18.0, *)` die Zoom-Übergänge (matchedTransitionSource,
      # navigationTransition(.zoom)). `#available` prüft nur zur Laufzeit —
      # übersetzt werden muss trotzdem gegen ein SDK, das die Symbole kennt.
      # Xcode 15.4 bringt iOS-SDK 17.5 und scheitert daran mit „has no member".
      #
      # Auf dem self-hosted Mac steht das nicht im Workflow, sondern hängt an
      # der dort installierten Version. Deshalb hier prüfen und mit klarer
      # Meldung abbrechen, statt den Build zwanzig Minuten später an einem
      # unverständlichen Fehler scheitern zu lassen.
      - name: Toolchain prüfen
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphonesimulator || true

          MAJOR="$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)"
          if [ "${MAJOR:-0}" -lt 16 ]; then
            echo "::error::Xcode $MAJOR auf diesem Runner, gebraucht wird 16 oder neuer." >&2
            echo "Die App verwendet iOS-18-APIs hinter #available; das SDK muss sie kennen." >&2
            echo "Abhilfe: neueres Xcode installieren und mit 'sudo xcode-select -s' auswählen." >&2
            exit 1
          fi

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project native/Nori-iOS/Nori.xcodeproj \
            -scheme Nori

      # Gegen den Simulator bauen: dafür wird keine Signatur gebraucht, und
      # der Typechecker läuft trotzdem über den gesamten iOS-Code.
      - name: Build Nori for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project native/Nori-iOS/Nori.xcodeproj \
            -scheme Nori \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/NoriIOSDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee "$RUNNER_TEMP/nori-ios-xcodebuild.log"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: nori-ios-xcodebuild-log
          path: ${{ runner.temp }}/nori-ios-xcodebuild.log
          if-no-files-found: ignore

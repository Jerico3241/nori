name: Build iOS

on:
  push:
    paths:
      - 'native/Nori-iOS/**'
      - 'native/NoriCore/**'
      - 'tools/require-xcode.sh'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Toolchain prüfen
        run: tools/require-xcode.sh 16

      - name: iOS SDK prüfen
        run: xcodebuild -showsdks | grep -i iphonesimulator

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project native/Nori-iOS/Nori.xcodeproj \
            -scheme Nori

      - name: Build Nori for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project native/Nori-iOS/Nori.xcodeproj \
            -scheme Nori \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/NoriIOSDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee "$RUNNER_TEMP/nori-ios-xcodebuild.log"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: nori-ios-xcodebuild-log
          path: ${{ runner.temp }}/nori-ios-xcodebuild.log
          if-no-files-found: ignore

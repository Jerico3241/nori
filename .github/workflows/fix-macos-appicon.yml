name: Fix macOS App Icon

on:
  push:
    paths:
      - '.github/workflows/fix-macos-appicon.yml'

permissions:
  contents: write

jobs:
  fix-icon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install image tooling
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Generate complete macOS app icon set
        shell: bash
        run: |
          set -euo pipefail
          ICON_DIR="native/Nori-macOS/Nori/Assets.xcassets/AppIcon.appiconset"
          MASTER="$ICON_DIR/icon.png"
          CONTENTS="$ICON_DIR/Contents.json"

          find "$ICON_DIR" -type f -name 'icon_*' -delete

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          icon_dir = Path("native/Nori-macOS/Nori/Assets.xcassets/AppIcon.appiconset")
          master_path = icon_dir / "icon.png"
          image = Image.open(master_path).convert("RGBA")
          if image.size != (1024, 1024):
              image = image.resize((1024, 1024), Image.Resampling.LANCZOS)
              image.save(master_path)

          outputs = {
              "icon_16x16.png": 16,
              "icon_16x16@2x.png": 32,
              "icon_32x32.png": 32,
              "icon_32x32@2x.png": 64,
              "icon_128x128.png": 128,
              "icon_128x128@2x.png": 256,
              "icon_256x256.png": 256,
              "icon_256x256@2x.png": 512,
              "icon_512x512.png": 512,
          }
          for filename, size in outputs.items():
              image.resize((size, size), Image.Resampling.LANCZOS).save(icon_dir / filename)
          PY

          cat > "$CONTENTS" <<'JSON'
          {
            "images": [
              { "filename": "icon_16x16.png", "idiom": "mac", "scale": "1x", "size": "16x16" },
              { "filename": "icon_16x16@2x.png", "idiom": "mac", "scale": "2x", "size": "16x16" },
              { "filename": "icon_32x32.png", "idiom": "mac", "scale": "1x", "size": "32x32" },
              { "filename": "icon_32x32@2x.png", "idiom": "mac", "scale": "2x", "size": "32x32" },
              { "filename": "icon_128x128.png", "idiom": "mac", "scale": "1x", "size": "128x128" },
              { "filename": "icon_128x128@2x.png", "idiom": "mac", "scale": "2x", "size": "128x128" },
              { "filename": "icon_256x256.png", "idiom": "mac", "scale": "1x", "size": "256x256" },
              { "filename": "icon_256x256@2x.png", "idiom": "mac", "scale": "2x", "size": "256x256" },
              { "filename": "icon_512x512.png", "idiom": "mac", "scale": "1x", "size": "512x512" },
              { "filename": "icon.png", "idiom": "mac", "scale": "2x", "size": "512x512" }
            ],
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          JSON

      - name: Commit corrected asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/Nori-macOS/Nori/Assets.xcassets/AppIcon.appiconset
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(macOS): generate complete app icon set"
          git push

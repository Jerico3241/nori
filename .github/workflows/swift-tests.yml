name: Swift tests

on:
  push:
    paths:
      - 'native/**'
      - '.github/workflows/swift-tests.yml'
  pull_request:
    paths:
      - 'native/**'
      - '.github/workflows/swift-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show toolchain
        run: swift --version

      # Das Paket bindet Models.swift aus dem macOS-Target ein, ohne sie zu
      # kopieren. Die Datei ist zwischen iOS und macOS byte-gleich, der Test
      # deckt damit beide Plattformen ab.
      - name: Run core tests
        working-directory: native
        run: swift test --enable-code-coverage

name: Swift tests

on:
  push:
    paths:
      - 'native/**'
      - 'tools/require-xcode.sh'
      - '.github/workflows/swift-tests.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Wählt ein vollständiges Xcode mit funktionierendem Swift-Compiler aus
      # und schreibt DEVELOPER_DIR für die folgenden Schritte nach GITHUB_ENV.
      - name: Toolchain prüfen
        run: tools/require-xcode.sh 15

      - name: Swift-Version prüfen
        run: swift --version

      # Das Paket baut die kanonischen Quellen aus
      # native/NoriCore/Sources/NoriCore. Damit prüfen diese Tests exakt den
      # Kern, den iOS und macOS über ihre Symlinks einbinden.
      - name: Run core tests
        working-directory: native
        run: swift test --enable-code-coverage

name: Build Windows

# Der Lauf, der Nori für Windows baut — auf dem self-hosted Mac, wie alle
# anderen Läufe des Projekts.
#
# ## Warum nicht mehr auf einem Windows-Runner von GitHub
#
# Weil es ihn nicht mehr gibt. Bei einem privaten Repository zählen gestellte
# Runner gegen das Minutenkontingent, Windows mit Faktor 2, und das Kontingent
# ist aufgebraucht — derselbe Grund, aus dem alle Apple-Läufe hier liegen.
# Gemessen, nicht vermutet: Lauf 35225331616 lief am öffentlichen Repository
# grün durch (14/14 Schritte, 4:25 min), Lauf 35227553568 zwanzig Minuten
# später am privaten scheiterte nach vier Sekunden mit
# `billable.WINDOWS.total_ms = 0` — der Job bekam nie einen Runner.
#
# ## Was der Mac kann und was nicht
#
# Bauen und durchspielen kann er alles: `tsc`, `esbuild` und Vite sind
# plattformunabhängig, und die Desktop-Prüfung startet Electron für macOS mit
# demselben Haupt- und Renderer-Code, den Windows später ausführt. Das ist die
# Prüfung, die Fehler in der App findet.
#
# Zwei Schritte kann er **nicht**:
#
#   Packen   `electron-builder` ruft für Windows-Ressourcen und die
#            NSIS-Deinstallationsroutine Windows-Programme auf. Auf einem Mac
#            braucht es dafür Wine — in **beiden** Hälften, 64 und 32 Bit;
#            ohne die 32-Bit-Hälfte scheitert NSIS an
#            `failed to load syswow64\ntdll.dll`. Der Schritt darunter prüft
#            das vorher und sagt genau das, statt mitten im Packen
#            umzufallen.
#
#   Das Paket prüfen   Was dabei entsteht, ist eine `Nori.exe`. Die lässt sich
#            auf einem Mac nicht starten, auch nicht unter Wine mit Playwright
#            davor. Dieser Schritt läuft deshalb nur auf einem
#            Windows-Runner — und steht hier, damit er wieder anspringt, sobald
#            es einen gibt.
#
# Ein auf dem Mac geschnürtes Paket ist damit kreuzgebaut und auf dem Zielsystem
# ungetestet. Wer Installer und ZIP wirklich geprüft haben will, braucht einen
# self-hosted Windows-Runner. Siehe docs/windows.md.
#
# ## Wann er läuft
#
#   Pull Request   bei jeder Änderung an Windows, der geteilten Schicht oder
#                  dem Kern — das Ergebnis liegt danach sieben Tage als
#                  Artefakt am Lauf und lässt sich von github.com laden.
#   Push auf main  dasselbe noch einmal auf dem gemergten Stand.
#   von Hand       Actions → Build Windows → Run workflow.
#
# Kein Tag-Auslöser, und der Branch-Filter bei `push` ist keine Zierde.
# Seit der gemeinsamen Release-Pipeline veröffentlicht ausschließlich
# `release.yml`, und `tools/test_nori_release.py` besteht darauf, dass **kein**
# Workflow an einem Tag hängt — auch nicht mittelbar über ein `push` ohne
# Branch-Filter, das für Tags mitläuft. Sonst stieße ein Release-Tag die Builds
# ein zweites Mal an und legte einen zweiten Release an.
#
# Windows ist in dieser Pipeline noch nicht vorgesehen: `nori-release.py` kennt
# ios, macos und webos. Installer und ZIP liegen deshalb vorerst als Artefakt
# am Lauf, nicht an einem Release. Siehe docs/windows.md.
on:
  pull_request:
    paths:
      - 'apps/windows/**'
      - 'shared/nori-app/**'
      - 'shared/nori-core/**'
      - '.github/workflows/build-windows.yml'
  push:
    branches: [main]
    paths:
      - 'apps/windows/**'
      - 'shared/nori-app/**'
      - 'shared/nori-core/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Die Version steht in `apps/windows/package.json` und sonst nirgends —
      # `electron-builder` nimmt sie von dort in Dateinamen,
      # Windows-Ressourcen und Deinstallationseintrag. Sie muss zur Wurzel
      # passen, sonst tragen Installer und Repository verschiedene Nummern.
      - name: Version bestimmen
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./apps/windows/package.json').version")"
          ROOT="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$ROOT" ]; then
            echo "apps/windows/package.json sagt $VERSION, package.json sagt $ROOT." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Nori für Windows $VERSION"

      # Der geteilte Kern zuerst: die Windows-App bindet ihn als `file:`-Paket
      # ein und braucht seine gebauten Deklarationen für die Typprüfung.
      - name: Kern bauen und prüfen
        working-directory: shared/nori-core
        run: |
          npm install --no-audit --no-fund
          npm test

      # `shared/nori-app` bekommt bewusst **kein** `npm install`: Die Schicht
      # ist Quelltext, ihre Abhängigkeiten stehen als `peerDependencies`, und
      # die App liefert sie. Ein `node_modules` dort wäre ein zweites React.
      - name: Windows-App bauen
        working-directory: apps/windows
        env:
          NORI_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.NORI_GOOGLE_DESKTOP_CLIENT_ID }}
          NORI_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.NORI_GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          npm install --no-audit --no-fund
          npm run build

      # Der Nachbau des Nori-Servers läuft über `https:` und erzeugt sich dafür
      # ein Wegwerf-Zertifikat. Ohne `openssl` bräche die Prüfung mitten im
      # Lauf ab, mit einer Meldung, die nach einem Fehler der App aussieht.
      - name: Voraussetzungen der Desktop-Prüfung
        shell: bash
        run: openssl version

      # Playwright ist bewusst keine Abhängigkeit von `apps/windows`: wer an
      # der App arbeitet, soll für ein `npm install` keinen Browser holen.
      - name: Desktop-Prüfung
        working-directory: apps/windows
        run: |
          npm i --no-save --no-audit --no-fund playwright
          node test/desktop.test.mjs

      # Nur bei einem Fehlschlag, vorher `always()`.
      #
      # Bildschirmfotos sind Diagnose, nicht Ergebnis: Auf einem grünen Lauf
      # sieht sie niemand an. Am 17.09. haben sie einen solchen Lauf gekippt —
      # der Fernbedienungslauf meldete 341/341, der Upload danach scheiterte an
      # `Artifact storage quota has been hit`, und alles ab dort wurde
      # übersprungen: der produktive Build, das Paket und sein
      # Referenzvergleich. Ein Diagnoseschritt hat die eigentliche Prüfung
      # verdeckt.
      #
      # `continue-on-error` wäre der naheliegende Griff und ist hier verboten:
      # `tools/test_nori_release.py` lässt in einem Paket-Job keinen Schritt zu,
      # der übergangen werden darf — sonst entstünde ein Paket über einer
      # ausgefallenen Prüfung. `if: failure()` erreicht dasselbe, ohne die Regel
      # anzutasten: Auf dem grünen Weg läuft der Schritt gar nicht erst.
      - name: Bildschirmfotos ablegen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Nori-Windows-Screenshots
          path: apps/windows/test-shots/*.png
          if-no-files-found: warn
          retention-days: 3

      # Erst die Werkzeuge, dann packen — dieselbe Lehre wie bei den
      # Apple-Läufen: eine fehlende Voraussetzung sieht sonst aus wie ein
      # Fehler im Quelltext. `electron-builder` bricht ohne die 32-Bit-Hälfte
      # von Wine mitten in NSIS ab, mit einer Meldung über `syswow64\ntdll.dll`,
      # die niemand ohne Vorwissen einordnet.
      - name: Voraussetzungen fürs Packen
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "Windows-Runner — kein Wine nötig."
            exit 0
          fi
          MISSING=""
          command -v wine64 >/dev/null 2>&1 || command -v wine >/dev/null 2>&1 || MISSING="wine64"
          if [ -n "$MISSING" ]; then
            echo "::error::Wine fehlt auf diesem Runner — ohne es entsteht kein Windows-Paket."
            {
              echo "  Gebraucht werden beide Hälften, 64 und 32 Bit."
              echo "  Ohne die 32-Bit-Hälfte scheitert NSIS an syswow64\\ntdll.dll."
              echo "  Einrichtung: docs/windows.md, Abschnitt 'In der CI bauen'."
              echo "  Alternative ohne Wine: ein self-hosted Windows-Runner."
            } >&2
            exit 1
          fi
          wine64 --version 2>/dev/null || wine --version

      - name: Installer und ZIP schnüren
        working-directory: apps/windows
        run: npm run package

      # Dieselben 56 Prüfungen noch einmal, aber gegen das **gepackte**
      # Ergebnis: `electron-builder` entscheidet selbst, was ins `app.asar`
      # kommt, und was dort fehlt, fällt sonst erst beim Nutzer auf.
      # Nur auf einem Windows-Runner: Was `electron-builder` ablegt, ist eine
      # `Nori.exe`, und die startet auf einem Mac nicht — auch nicht mit
      # Playwright davor. Der Schritt bleibt stehen, damit er wieder
      # anspringt, sobald ein Windows-Runner da ist.
      - name: Desktop-Prüfung gegen das Paket
        if: runner.os == 'Windows'
        working-directory: apps/windows
        env:
          NORI_PACKAGED: release/win-unpacked/Nori.exe
          NORI_SHOTS: test-shots-packaged
        run: node test/desktop.test.mjs

      - name: Paket ablegen
        uses: actions/upload-artifact@v4
        with:
          name: Nori-Windows-${{ steps.meta.outputs.version }}
          path: |
            apps/windows/release/Nori-Setup-*.exe
            apps/windows/release/Nori-*-portable.zip
          if-no-files-found: error
          retention-days: 7

      - name: Prüfsummen ins Protokoll
        if: always()
        shell: bash
        run: |
          cd apps/windows/release 2>/dev/null || exit 0
          sha256sum Nori-Setup-*.exe Nori-*-portable.zip 2>/dev/null || true

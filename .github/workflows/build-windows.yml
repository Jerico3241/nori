name: Build Windows

# Der Lauf, der Nori für Windows baut, prüft und packt — auf dem
# GitHub-Runner `windows-latest`. Die Desktop-Prüfung läuft damit gegen
# das gepackte `Nori.exe`, nicht nur gegen Electron für macOS.
#
# Ein anderer Runner lässt sich ohne Änderung an dieser Datei wählen:
# Repository-Variable `NORI_WINDOWS_RUNNER`, etwa
# `["self-hosted", "Windows"]`. Was er mitbringen muss: docs/windows.md.
#
# ## Wann er läuft
#
#   Push      bei jeder Änderung an Windows, der geteilten Schicht oder dem
#             Kern: bauen, prüfen, packen — ohne Hochladen (rund 200 MB)
#   von Hand  Actions → Build Windows → Run workflow; Installer und ZIP
#             liegen danach drei Tage am Lauf
#   Release   aufgerufen von `Nori Release` mit `release-version`; dann
#             sind die Google-Secrets Pflicht
#
# Kein Tag-Auslöser: veröffentlicht wird ausschließlich über `Nori Release`.
on:
  push:
    # Nur Branches: ein Release-Tag startet keinen Lauf.
    branches: ['**']
    paths:
      - 'apps/windows/**'
      - 'shared/nori-app/**'
      - 'shared/nori-core/**'
      - 'tools/nori-release.py'
      - 'tools/nori-version.py'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      release-version:
        description: Gemeinsame Nori-Version des Releases
        type: string
        required: true
    secrets:
      NORI_GOOGLE_DESKTOP_CLIENT_ID:
        required: false
      NORI_GOOGLE_DESKTOP_CLIENT_SECRET:
        required: false
    outputs:
      asset_installer:
        description: Dateiname des geprüften Installers
        value: ${{ jobs.build.outputs.asset_installer }}
      asset_portable:
        description: Dateiname des geprüften ZIP
        value: ${{ jobs.build.outputs.asset_portable }}
      sha256_installer:
        description: Prüfsumme des geprüften Installers
        value: ${{ jobs.build.outputs.sha256_installer }}
      sha256_portable:
        description: Prüfsumme des geprüften ZIP
        value: ${{ jobs.build.outputs.sha256_portable }}

# Im Release eine eigene Gruppe je Lauf — Begründung in build-ios.yml.
concurrency:
  group: ${{ inputs.release-version && format('nori-release-{0}-windows', github.run_id) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ !inputs.release-version }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ vars.NORI_WINDOWS_RUNNER && fromJSON(vars.NORI_WINDOWS_RUNNER) || 'windows-latest' }}
    timeout-minutes: 40
    outputs:
      asset_installer: ${{ steps.meta.outputs.asset_windows_installer }}
      asset_portable: ${{ steps.meta.outputs.asset_windows_portable }}
      sha256_installer: ${{ steps.installer.outputs.sha256 }}
      sha256_portable: ${{ steps.release-check.outputs.sha256 }}
    env:
      RELEASE_VERSION: ${{ inputs.release-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Die Version steht in `apps/windows/package.json`; `electron-builder`
      # nimmt sie von dort in Dateinamen, Versionsangaben der EXE und
      # Deinstallationseintrag. Sie ist die gemeinsame Nori-Version — alle
      # Stellen gleich, im Release die bestätigte.
      - name: Version prüfen
        id: meta
        shell: bash
        run: python3 tools/nori-release.py meta --platform windows --release-version "$RELEASE_VERSION" --github-output

      # Ein Release ohne eingebauten Google-Client wäre eine Fassung ohne
      # Abgleich — dieselbe Lehre wie bei der iOS-IPA 1.25.0. Geprüft wird nur,
      # ob die Secrets gesetzt sind; ihr Wert erscheint nirgends.
      - name: Google-Zugang für den Release prüfen
        if: ${{ inputs.release-version }}
        shell: bash
        env:
          HAS_ID: ${{ secrets.NORI_GOOGLE_DESKTOP_CLIENT_ID != '' }}
          HAS_SECRET: ${{ secrets.NORI_GOOGLE_DESKTOP_CLIENT_SECRET != '' }}
        run: |
          if [ "$HAS_ID" != "true" ] || [ "$HAS_SECRET" != "true" ]; then
            echo "::error::Für ein Windows-Release fehlen die Repository-Secrets NORI_GOOGLE_DESKTOP_CLIENT_ID und NORI_GOOGLE_DESKTOP_CLIENT_SECRET (docs/windows.md)."
            exit 1
          fi
          echo "Google-Desktop-Client ist hinterlegt."

      # Der geteilte Kern zuerst: die Windows-App bindet ihn als `file:`-Paket
      # ein und braucht seine gebauten Deklarationen für die Typprüfung.
      - name: Kern bauen und prüfen
        working-directory: shared/nori-core
        run: |
          npm install --no-audit --no-fund
          npm test

      # `shared/nori-app` bekommt bewusst **kein** `npm install`: Die Schicht
      # ist Quelltext, ihre Abhängigkeiten stehen als `peerDependencies`, und
      # die App liefert sie. Ein `node_modules` dort wäre ein zweites React.
      - name: Windows-App bauen
        working-directory: apps/windows
        env:
          NORI_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.NORI_GOOGLE_DESKTOP_CLIENT_ID }}
          NORI_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.NORI_GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          npm install --no-audit --no-fund
          npm run build

      # Der Nachbau des Nori-Servers läuft über `https:` und erzeugt sich dafür
      # ein Wegwerf-Zertifikat. Ohne `openssl` bräche die Prüfung mitten im
      # Lauf ab, mit einer Meldung, die nach einem Fehler der App aussieht.
      - name: Voraussetzungen der Desktop-Prüfung
        shell: bash
        run: openssl version

      # Playwright ist bewusst keine Abhängigkeit von `apps/windows`: wer an
      # der App arbeitet, soll für ein `npm install` keinen Browser holen.
      - name: Desktop-Prüfung
        working-directory: apps/windows
        run: |
          npm i --no-save --no-audit --no-fund playwright
          node test/desktop.test.mjs

      # Nur bei einem Fehlschlag — Begründung in build-webos.yml.
      - name: Bildschirmfotos ablegen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Nori-Windows-Screenshots
          path: apps/windows/test-shots/*.png
          if-no-files-found: warn
          retention-days: 3

      # Wine braucht es auf dem Mac nicht (Kopf dieser Datei), wohl aber
      # Rosetta 2 auf einem Apple-Chip: Der NSIS-Compiler, den
      # `electron-builder` mitbringt, liegt für macOS nur als Intel-Programm
      # vor. Ohne Rosetta bräche das Packen mit einer Meldung ab, die niemand
      # darauf zurückführt.
      - name: Voraussetzungen fürs Packen
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ] && [ "$(uname -m)" = "arm64" ]; then
            if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
              echo "::error::Rosetta 2 fehlt – der NSIS-Compiler von electron-builder ist ein Intel-Programm. Einrichten: softwareupdate --install-rosetta --agree-to-license (docs/self-hosted-runner.md)."
              exit 1
            fi
            echo "Rosetta 2 vorhanden."
          fi

      # `npm run package` baut noch einmal — mit denselben Werten wie oben.
      - name: Installer und ZIP schnüren
        working-directory: apps/windows
        env:
          NORI_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.NORI_GOOGLE_DESKTOP_CLIENT_ID }}
          NORI_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.NORI_GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: npm run package

      # Dieselben Prüfungen noch einmal, aber gegen das **gepackte** Ergebnis:
      # `electron-builder` entscheidet selbst, was ins `app.asar` kommt, und
      # was dort fehlt, fällt sonst erst beim Nutzer auf. Nur auf einem
      # Windows-Runner — `Nori.exe` startet auf dem Mac nicht.
      - name: Desktop-Prüfung gegen das Paket
        if: runner.os == 'Windows'
        working-directory: apps/windows
        env:
          NORI_PACKAGED: release/win-unpacked/Nori.exe
          NORI_SHOTS: test-shots-packaged
        run: node test/desktop.test.mjs

      # Installer und ZIP unter den gemeinsamen Namen ablegen und prüfen:
      # Produktversion der EXE, `app.asar` mit Version und Programm, keine
      # fremden Zugangsdaten, keine Tokens — im Release zusätzlich, dass der
      # Google-Desktop-Client wirklich eingebaut ist (`--production`).
      - name: Installer für den Release prüfen
        id: installer
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          ASSET: ${{ steps.meta.outputs.asset_windows_installer }}
          NORI_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.NORI_GOOGLE_DESKTOP_CLIENT_ID }}
          NORI_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.NORI_GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/nori-windows"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp "apps/windows/release/Nori-Setup-$VERSION.exe" "$OUT/$ASSET"
          python3 tools/nori-release.py verify --asset windows-installer --file "$OUT/$ASSET" \
            --release-version "$RELEASE_VERSION" --github-output

      - name: Pakete für den Release prüfen
        id: release-check
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          ASSET: ${{ steps.meta.outputs.asset_windows_portable }}
          NORI_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.NORI_GOOGLE_DESKTOP_CLIENT_ID }}
          NORI_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.NORI_GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/nori-windows"
          cp "apps/windows/release/Nori-$VERSION-portable.zip" "$OUT/$ASSET"
          PRODUCTION=""
          if [ -n "$RELEASE_VERSION" ]; then
            PRODUCTION="--production"
          fi
          python3 tools/nori-release.py verify --asset windows-portable --file "$OUT/$ASSET" \
            --release-version "$RELEASE_VERSION" $PRODUCTION --github-output

      # Im Release nur die Übergabe an den Release-Job: ein Tag. Von Hand als
      # Testpaket drei Tage. Bei einem Push gar nicht: Installer und ZIP sind
      # zusammen rund 200 MB, und das Artefakt-Kontingent des Repositorys war
      # schon einmal voll. Gepackt und geprüft wird trotzdem.
      - name: Pakete ablegen
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: ${{ runner.temp }}/nori-windows/
          if-no-files-found: error
          retention-days: ${{ steps.meta.outputs.retention }}
          overwrite: true

      - name: Prüfsummen ins Protokoll
        if: always()
        shell: bash
        run: |
          cd "$RUNNER_TEMP/nori-windows" 2>/dev/null || exit 0
          (shasum -a 256 ./* || sha256sum ./*) 2>/dev/null || true

      # Das Paket trägt im Release den Google-Desktop-Client. Weder das Paket
      # noch der gebaute Hauptprozess bleiben im Arbeitsverzeichnis liegen.
      - name: Pakete aus dem Checkout entfernen
        if: always()
        shell: bash
        run: rm -rf apps/windows/release apps/windows/dist apps/windows/dist-main "$RUNNER_TEMP/nori-windows"

name: Check release pipeline

# Gemeinsame Version und Release-Werkzeug — bei jeder Änderung, die ein Paket,
# eine Versionsstelle, den Changelog oder die Release-Logik berührt, auch auf
# Branches. So fällt eine vergessene Nummer, ein fehlender Changelog-Abschnitt
# oder ein kaputter Workflow vor dem Merge auf, nicht erst beim nächsten
# Release. Legt nichts an und löscht nichts.
#
# Auf einem Branch gilt zusätzlich: Ändert er etwas, das in einem Paket
# landet, muss die gemeinsame Nori-Version größer sein als jede Nummer auf
# main, und die Buildnummer von iOS muss steigen. Sonst gäbe es
# zwei verschiedene Pakete unter derselben Nummer, und ein Gerät hielte das
# neuere nicht für neuer.
on:
  push:
    # Nur Branches: ein Release-Tag startet keinen Lauf.
    branches: ['**']
    paths:
      - 'native/**'
      - 'config/contract.json'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'tools/nori-release.py'
      - 'tools/nori-version.py'
      - 'tools/test_nori_release.py'
      - 'tools/test_nori_version.py'
      - 'tools/changelog-section.py'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Die ganze Geschichte: der Vergleich braucht origin/main.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Versionswerkzeug testen
        run: python3 tools/test_nori_version.py

      - name: Release-Werkzeug testen
        run: python3 tools/test_nori_release.py

      - name: Gemeinsame Version prüfen
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            python3 tools/nori-version.py check
          else
            python3 tools/nori-version.py check --against origin/main
          fi

      - name: Release Notes der aktuellen Version
        run: python3 tools/nori-release.py notes

name: Nori Release

# Der eine Weg zu einem Nori-Release: eine Version, ein Tag `v<VERSION>`, ein
# GitHub Release `Nori v<VERSION>` mit der IPA für iPhone und iPad und
# `checksums-sha256.txt`. macOS, Windows und LG webOS sind entfernt.
#
#   GitHub → Actions → Nori Release → Run workflow → Version 2.6.0
#
# Die Nummer steht vorher im Repository: `python3 tools/nori-version.py set …`
# und ein Abschnitt `## [Nori …]` in CHANGELOG.md, gemergt auf main. Die
# Eingabe hier bestätigt sie nur — weicht sie ab, entsteht nichts.
#
#   prepare    Eingabe, Versionsstellen, Changelog, vorhandene Tags und
#              Releases, Buildnummern früherer Releases
#   checks     Werkzeuge, Apple-Quellen, Swift-Kern
#   ios        der Lauf `Build iOS` mit `release-version`: bauen, testen,
#              packen, Paket prüfen, als Übergabe (ein Tag) ablegen
#   publish    das Paket holen und noch einmal prüfen, Prüfsummen, Entwurf,
#              Anhänge, Tag, Veröffentlichung
#   validate   den veröffentlichten Release von außen nachprüfen
#   cleanup    erst dann: alte Läufe der Nori-Workflows und die Übergabe-
#              Artefakte dieses Laufs löschen
#
# Scheitert ein Schritt, laufen die folgenden nicht: kein halber Release, kein
# Aufräumen.
#
# Runner: Linux für prepare/publish/validate/cleanup, macos-26 für den
# Swift-Kern und die IPA. Einzelheiten: docs/releases.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, z. B. 2.6.0 oder v2.6.0 — muss der Nummer im Repository entsprechen'
        type: string
        required: true
      dry_run:
        description: 'Probelauf: alles bauen und prüfen, nichts veröffentlichen, nichts löschen'
        type: boolean
        default: false

# Nie zwei Releases gleichzeitig, und ein laufender wird nicht abgebrochen.
concurrency:
  group: nori-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Version prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      tag: ${{ steps.prepare.outputs.tag }}
      platforms: ${{ steps.prepare.outputs.platforms }}
      dry_run: ${{ steps.mode.outputs.dry_run }}
    steps:
      # Alle Tags: die Buildnummern früherer Releases stehen in deren Stand.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Modus
        id: mode
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

      # Früh statt nach dem Bauen: Eine IPA ohne Google-Client-ID wäre eine
      # Fassung ohne Abgleich. Geprüft wird nur, ob das Secret gesetzt ist —
      # sein Wert erscheint nirgends.
      - name: iOS-Voraussetzungen
        env:
          HAS_ID: ${{ secrets.NORI_GOOGLE_IOS_CLIENT_ID != '' }}
        run: |
          if [ "$HAS_ID" != "true" ]; then
            echo "::error::Das Repository-Secret NORI_GOOGLE_IOS_CLIENT_ID fehlt – ohne es hätte Nori keinen Google-Abgleich. Secret anlegen (docs/google-drive-sync.md)."
            exit 1
          fi

      # Die Eingabe kommt nur als Umgebungsvariable ins Skript, nie als
      # eingesetzter Text. Das Werkzeug akzeptiert 2.6.0 und v2.6.0 und
      # arbeitet danach nur mit 2.6.0.
      - name: Release vorbereiten
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION_INPUT: ${{ inputs.version }}
          PLATFORMS: ios
        run: python3 tools/nori-release.py prepare --version "$VERSION_INPUT" --platforms "$PLATFORMS" --github-output

  checks:
    name: Gemeinsamer Kern
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Werkzeuge testen
        run: |
          python3 tools/test_nori_version.py
          python3 tools/test_nori_release.py
          python3 tools/test_configure_google_oauth.py

      - name: Apple-Quellen prüfen
        run: python3 tools/check-apple-sources.py

      - name: Toolchain prüfen
        run: tools/require-xcode.sh 15

      - name: Swift-Kern testen
        working-directory: native
        run: swift test

  ios:
    name: iOS / iPadOS
    needs: [prepare, checks]
    permissions:
      contents: read
    secrets: inherit
    uses: ./.github/workflows/build-ios.yml
    with:
      release-version: ${{ needs.prepare.outputs.version }}

  # Nur wenn alles davor grün ist.
  publish:
    name: Release veröffentlichen
    needs: [prepare, checks, ios]
    if: >-
      ${{ !cancelled()
      && needs.prepare.result == 'success'
      && needs.checks.result == 'success'
      && needs.ios.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Paket dieses Laufs holen
        uses: actions/download-artifact@v5
        with:
          pattern: nori-release-*
          path: ${{ runner.temp }}/nori-release/assets
          merge-multiple: true

      # Prüft das Paket noch einmal gegen die Prüfsumme aus seinem Paket-Job,
      # wiederholt die Produktionsprüfungen, schreibt checksums-sha256.txt und
      # die Notes — und legt erst dann Entwurf, Anhänge, Tag und
      # Veröffentlichung an. Gibt es Tag oder Release inzwischen, bricht es ab.
      - name: Release anlegen
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORMS: ${{ needs.prepare.outputs.platforms }}
          DRY_RUN: ${{ needs.prepare.outputs.dry_run == 'true' && '--dry-run' || '' }}
          SHA256_IOS: ${{ needs.ios.outputs.sha256 }}
        run: |
          python3 tools/nori-release.py publish --version "$VERSION" --platforms "$PLATFORMS" \
            --dir "$RUNNER_TEMP/nori-release/assets" --commit "$GITHUB_SHA" \
            --sha256 "ios=$SHA256_IOS" \
            $DRY_RUN

      - name: Heruntergeladene Pakete entfernen
        if: always()
        run: rm -rf "$RUNNER_TEMP/nori-release"

  validate:
    name: Release nachprüfen
    needs: [prepare, publish]
    if: >-
      ${{ !cancelled()
      && needs.prepare.result == 'success'
      && needs.publish.result == 'success'
      && needs.prepare.outputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Von außen, mit Lesezugriff: Release veröffentlicht, Tag auf diesem
      # Commit, genau die erwarteten Anhänge, jede Prüfsumme bei GitHub gleich
      # der in checksums-sha256.txt.
      - name: Release von außen prüfen
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORMS: ${{ needs.prepare.outputs.platforms }}
        run: python3 tools/nori-release.py validate --version "$VERSION" --platforms "$PLATFORMS" --commit "$GITHUB_SHA"

  # Erst nach einem veröffentlichten und nachgeprüften Release. Gelöscht
  # werden nur abgeschlossene, ältere Läufe der Nori-Build- und
  # Release-Workflows (Liste in tools/nori-release.py) und die
  # Übergabe-Artefakte dieses Laufs — nie dieser Lauf, nie Releases, Anhänge,
  # Tags, Branches oder Workflow-Dateien.
  cleanup:
    name: Alte Läufe aufräumen
    needs: [prepare, publish, validate]
    if: >-
      ${{ !cancelled()
      && needs.prepare.result == 'success'
      && needs.publish.result == 'success'
      && needs.validate.result == 'success'
      && needs.prepare.outputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Alte Nori-Läufe und Übergabe-Artefakte löschen
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORMS: ${{ needs.prepare.outputs.platforms }}
        run: |
          python3 tools/nori-release.py cleanup --version "$VERSION" --platforms "$PLATFORMS" \
            --commit "$GITHUB_SHA" --keep-run "$GITHUB_RUN_ID"

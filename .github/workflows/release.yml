name: Release

# Ausgelöst durch einen Tag, nicht durch einen Push auf main: ein Release ist
# eine bewusste Entscheidung, kein Nebenprodukt jedes Commits.
#
#   git tag macos-v1.10.2 && git push origin macos-v1.10.2
#   git tag ios-v1.9.4    && git push origin ios-v1.9.4
#
# Die beiden Plattformen haben eigene Versionsstände und deshalb eigene Tags.
#
# Alternativ von Hand über „Run workflow" starten und den Tag angeben: dann
# legt der Workflow ihn auf dem gewählten Stand selbst an — aber erst, nachdem
# die beiden Prüfungen unten durchgelaufen sind. So entsteht kein Tag, den
# hinterher niemand mehr loswird, weil die Version nicht passt.
on:
  push:
    tags:
      - 'macos-v*'
      - 'ios-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag, z. B. macos-v1.10.2'
        required: true

permissions:
  contents: write

# Läuft auf dem self-hosted Runner (ein Mac). Der verbraucht keine
# GitHub-Minuten — bei einem privaten Repository zählt eine macOS-Minute sonst
# zehnfach, und genau daran war das Kontingent aufgebraucht.
#
# Folgen davon: der Mac muss an und online sein, sonst warten die Jobs. Und es
# gibt nur einen Runner, die Jobs laufen also nacheinander — deshalb die
# concurrency-Gruppe, die überholte Läufe abbricht, statt sie abzuarbeiten.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10
    steps:
      # `github.ref` ist bei einem Tag-Push der Tag und bei „Run workflow" der
      # Branch, auf dem gestartet wurde. Beides ist der richtige Stand; der Tag
      # aus `inputs` existiert an dieser Stelle womöglich noch gar nicht.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Plattform und Version aus dem Tag lesen
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"

          case "$TAG" in
            macos-v*) PLATFORM="macOS"; DIR="native/Nori-macOS"; PROJECT="native/Nori-macOS/NoriMac.xcodeproj/project.pbxproj" ;;
            ios-v*)   PLATFORM="iOS";   DIR="native/Nori-iOS";   PROJECT="native/Nori-iOS/Nori.xcodeproj/project.pbxproj" ;;
            *) echo "Tag muss mit macos-v oder ios-v beginnen: $TAG" >&2; exit 1 ;;
          esac

          VERSION="${TAG#*-v}"
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version im Tag sieht nicht nach x.y.z aus: $VERSION" >&2
            exit 1
          fi

          # Gegenprobe: der Tag muss zu dem sagen, was im Projekt steht.
          # Sonst entsteht ein Release, dessen Inhalt eine andere Version ist.
          IN_PROJECT="$(grep -oE 'MARKETING_VERSION = [0-9.]+' "$PROJECT" | head -1 | awk '{print $3}')"
          if [ "$IN_PROJECT" != "$VERSION" ]; then
            echo "Tag sagt $VERSION, $PROJECT sagt $IN_PROJECT." >&2
            echo "Erst die Version im Projekt anheben, dann taggen." >&2
            exit 1
          fi

          {
            echo "platform=$PLATFORM"
            echo "version=$VERSION"
            echo "dir=$DIR"
            echo "asset=Nori-$PLATFORM-$VERSION-source.zip"
          } >> "$GITHUB_OUTPUT"

      - name: Release-Notiz aus dem Changelog holen
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/changelog-section.py \
            "${{ steps.meta.outputs.platform }}" \
            "${{ steps.meta.outputs.version }}" > notes.md
          {
            echo ""
            echo "---"
            echo ""
            echo "Quellpaket: \`${{ steps.meta.outputs.asset }}\`. In Xcode öffnen und mit einem"
            echo "Personal Team signieren; ein fertiges Programm liegt hier nicht bei."
          } >> notes.md

      # Beim Tag-Push gibt es den Tag schon. Beim Start von Hand entsteht er
      # hier — nach den Prüfungen oben, nicht davor.
      - name: Tag anlegen, falls er noch fehlt
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG existiert bereits, wird nicht verschoben."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Nori ${{ steps.meta.outputs.platform }} ${{ steps.meta.outputs.version }}"
          git push origin "$TAG"

      - name: Quellpaket schnüren
        shell: bash
        run: |
          set -euo pipefail
          zip -r -q "${{ steps.meta.outputs.asset }}" "${{ steps.meta.outputs.dir }}"
          # Geteilte Kernregeln und ihre Tests gehören dazu, sonst lässt sich
          # das Paket nicht prüfen.
          zip -r -q "${{ steps.meta.outputs.asset }}" native/Package.swift native/Tests
          zip -q "${{ steps.meta.outputs.asset }}" CHANGELOG.md README.md
          unzip -l "${{ steps.meta.outputs.asset }}" | tail -1

      # Bewusst über die REST-API statt über die gh-CLI: die liegt auf einem
      # frischen Mac nicht, und der Runner soll ohne Homebrew auskommen. curl
      # und python3 sind da, sobald Xcode installiert ist.
      - name: Release anlegen
        env:
          TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          TITLE: Nori ${{ steps.meta.outputs.platform }} ${{ steps.meta.outputs.version }}
          ASSET: ${{ steps.meta.outputs.asset }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${{ github.repository }}"

          # Der Tag muss existieren — sonst würde die API ihn stillschweigend
          # auf dem Standardzweig anlegen, und das Release zeigte auf den
          # falschen Stand.
          git fetch --tags --quiet origin
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null \
            || { echo "Tag $TAG existiert nicht." >&2; exit 1; }

          BODY="$(python3 -c '
          import json, os, sys
          print(json.dumps({
              "tag_name": os.environ["TAG"],
              "name": os.environ["TITLE"],
              "body": open("notes.md").read(),
              "draft": False,
              "prerelease": False,
          }))')"

          ID="$(curl -sS -X POST "$API/releases" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "$BODY" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("id") or sys.exit("Release nicht angelegt: " + json.dumps(d)[:400]))')"

          curl -sS -X POST \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$ID/assets?name=$ASSET" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary "@$ASSET" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("Angehängt:", d.get("name") or sys.exit("Anhang fehlgeschlagen: " + json.dumps(d)[:400]))'

          echo "Release: https://github.com/${{ github.repository }}/releases/tag/$TAG"

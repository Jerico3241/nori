name: Release

on:
  push:
    tags:
      - 'macos-v*'
      - 'ios-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag, z. B. macos-v1.14.3'
        required: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Plattform und Version aus dem Tag lesen
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"

          case "$TAG" in
            macos-v*) PLATFORM="macOS"; DIR="native/Nori-macOS"; PROJECT="native/Nori-macOS/NoriMac.xcodeproj/project.pbxproj" ;;
            ios-v*)   PLATFORM="iOS";   DIR="native/Nori-iOS";   PROJECT="native/Nori-iOS/Nori.xcodeproj/project.pbxproj" ;;
            *) echo "Tag muss mit macos-v oder ios-v beginnen: $TAG" >&2; exit 1 ;;
          esac

          VERSION="${TAG#*-v}"
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version im Tag sieht nicht nach x.y.z aus: $VERSION" >&2
            exit 1
          fi

          IN_PROJECT="$(grep -oE 'MARKETING_VERSION = [0-9.]+' "$PROJECT" | head -1 | awk '{print $3}')"
          if [ "$IN_PROJECT" != "$VERSION" ]; then
            echo "Tag sagt $VERSION, $PROJECT sagt $IN_PROJECT." >&2
            exit 1
          fi

          {
            echo "platform=$PLATFORM"
            echo "version=$VERSION"
            echo "dir=$DIR"
            echo "asset=Nori-$PLATFORM-$VERSION-source.zip"
          } >> "$GITHUB_OUTPUT"

      - name: Release-Notiz aus dem Changelog holen
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/changelog-section.py \
            "${{ steps.meta.outputs.platform }}" \
            "${{ steps.meta.outputs.version }}" > notes.md
          {
            echo ""
            echo "---"
            echo ""
            echo "Quellpaket: \`${{ steps.meta.outputs.asset }}\`. In Xcode öffnen und mit einem"
            echo "Personal Team signieren; ein fertiges Programm liegt hier nicht bei."
          } >> notes.md

      - name: Tag anlegen, falls er noch fehlt
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG existiert bereits, wird nicht verschoben."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Nori ${{ steps.meta.outputs.platform }} ${{ steps.meta.outputs.version }}"
          git push origin "$TAG"

      # Der Release baut kein IPA, sondern ein Quellpaket — die fehlende
      # Google-Client-ID aus `Package iOS IPA` kann hier nicht auftreten. Die
      # Gefahr ist die umgekehrte: eine lokale Google-Konfiguration aus dem
      # Arbeitsverzeichnis des Runners darf nie in ein öffentliches Paket.
      - name: Quellpaket schnüren
        shell: bash
        run: |
          set -euo pipefail
          zip -r -y -q "${{ steps.meta.outputs.asset }}" \
            "${{ steps.meta.outputs.dir }}" \
            native/NoriCore \
            native/Package.swift \
            native/Tests \
            config/contract.json \
            CHANGELOG.md \
            README.md \
            -x '*/Config/*.local.xcconfig' '*.env.local' '*oauth*.json' 'client_secret*.json'
          if unzip -l "${{ steps.meta.outputs.asset }}" | grep -E '\.local\.xcconfig|\.env\.local|oauth.*\.json|client_secret'; then
            echo "Lokale OAuth-Konfiguration im Quellpaket." >&2
            exit 1
          fi
          unzip -l "${{ steps.meta.outputs.asset }}" | tail -1

      - name: Release anlegen
        env:
          TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          TITLE: Nori ${{ steps.meta.outputs.platform }} ${{ steps.meta.outputs.version }}
          ASSET: ${{ steps.meta.outputs.asset }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${{ github.repository }}"

          git fetch --tags --quiet origin
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null \
            || { echo "Tag $TAG existiert nicht." >&2; exit 1; }

          BODY="$(python3 -c '
          import json, os
          print(json.dumps({
              "tag_name": os.environ["TAG"],
              "name": os.environ["TITLE"],
              "body": open("notes.md").read(),
              "draft": False,
              "prerelease": False,
          }))')"

          ID="$(curl -sS -X POST "$API/releases" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "$BODY" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("id") or sys.exit("Release nicht angelegt: " + json.dumps(d)[:400]))')"

          curl -sS -X POST \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$ID/assets?name=$ASSET" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary "@$ASSET" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("Angehängt:", d.get("name") or sys.exit("Anhang fehlgeschlagen: " + json.dumps(d)[:400]))'

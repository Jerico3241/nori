name: Release

# Legt GitHub-Releases an — plattformgetrennt, jede Version genau einmal.
#
# Kein eigener Auslöser über Tags. Dieser Workflow ist der letzte Job der
# Paket-Läufe `Package iOS IPA`, `Build webOS` und `Package macOS Source` und
# startet dort nur, wenn deren Paket-Job auf `main` mit allen Produktions- und
# Zugangsdatenprüfungen grün war (`needs:` ohne `always()`). Veröffentlicht
# wird genau das Artefakt dieses Laufs, erkannt an der Prüfsumme, die der
# Paket-Job nach seinen Prüfungen festgehalten hat. Gebaut wird hier nichts.
#
# Die Regeln — Tag-Schema, keine Duplikate, nie verschieben, Release Notes ohne
# interne Einzelheiten — stehen in tools/nori-release.py, die Tests in
# tools/test_nori_release.py, die Beschreibung in docs/releases.md.
#
# Von Hand (workflow_dispatch) lässt sich nur ein Release für einen schon
# abgeschlossenen, erfolgreichen Paket-Lauf nachholen: den jüngsten auf main,
# für die Version, die main gerade trägt. Standardmäßig als Probelauf.
on:
  workflow_call:
    inputs:
      platform:
        description: ios, macos oder webos
        type: string
        required: true
      artifact:
        description: Name des geprüften Artefakts in diesem Lauf
        type: string
        required: true
      sha256:
        description: Prüfsumme des geprüften Pakets aus dem Paket-Job
        type: string
        required: true
      run_id:
        type: string
        required: false
        default: ''
      dry_run:
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      platform:
        description: Plattform
        type: choice
        options: [ios, macos, webos]
        required: true
      run_id:
        description: ID des erfolgreichen Paket-Laufs auf main
        type: string
        required: true
      dry_run:
        description: Nur prüfen, nichts anlegen
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: GitHub-Release
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20
    # Ein Release wird nie mitten im Veröffentlichen abgebrochen; Läufe
    # derselben Plattform warten aufeinander.
    concurrency:
      group: nori-release-${{ inputs.platform }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Release-Werkzeug prüfen
        run: python3 tools/test_nori_release.py

      - name: Geprüftes Paket dieses Laufs holen
        if: inputs.run_id == ''
        uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/nori-release/asset

      # Liest Version und Build aus dem Commit, prüft Name, Prüfsumme und Inhalt
      # des Pakets, wiederholt die Produktionsprüfung der Plattform, erzeugt die
      # Notes aus CHANGELOG.md — und legt erst dann Entwurf, Anhang, Tag und
      # Veröffentlichung an. Gibt es den Release schon, endet es hier grün.
      - name: Release anlegen
        if: inputs.run_id == ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLATFORM: ${{ inputs.platform }}
          SHA256: ${{ inputs.sha256 }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          python3 tools/nori-release.py publish --platform "$PLATFORM" \
            --dir "$RUNNER_TEMP/nori-release/asset" --sha256 "$SHA256" --commit "$GITHUB_SHA" $DRY_RUN

      - name: Release für einen abgeschlossenen Paket-Lauf nachholen
        if: inputs.run_id != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLATFORM: ${{ inputs.platform }}
          RUN_ID: ${{ inputs.run_id }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: python3 tools/nori-release.py from-run --platform "$PLATFORM" --run-id "$RUN_ID" $DRY_RUN

      - name: Heruntergeladene Pakete entfernen
        if: always()
        run: rm -rf "$RUNNER_TEMP/nori-release"

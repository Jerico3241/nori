name: Build webOS

# Läuft auf demselben self-hosted Mac wie alle anderen Läufe. Bei einem
# privaten Repository zählt eine GitHub-Minute — genau daran war das Kontingent
# schon einmal aufgebraucht.
#
# Folgen davon: der Mac muss an und online sein, sonst warten die Jobs. Und es
# gibt nur einen Runner, die Jobs laufen also nacheinander — deshalb die
# concurrency-Gruppe, die überholte Läufe abbricht, statt sie abzuarbeiten.
#
# Anders als die Swift-Läufe braucht dieser hier kein Xcode, nur Node. Er ist
# damit der einzige Lauf des Projekts, der eine Änderung tatsächlich
# durchbauen und testen kann, statt sie nur statisch zu prüfen.
#
# Derselbe Lauf baut das `.ipk` für einen Release: `Nori Release` ruft ihn mit
# `release-version` auf. Das Paket heißt dann `Nori-webOS-v<VERSION>.ipk` und
# liegt nur einen Tag als Übergabe am Lauf; ein Testpaket aus einem Push trägt
# den Commit im Namen und bleibt drei Tage. Einen eigenen Release legt dieser
# Lauf nicht mehr an.
on:
  push:
    # Nur Branches: ein Release-Tag startet keinen Lauf.
    branches: ['**']
    paths:
      - 'apps/webos/**'
      - 'shared/nori-app/**'
      - 'shared/nori-core/**'
      - 'services/nori-api/**'
      - 'tools/check-webos-package.py'
      - 'tools/test_check_webos_package.py'
      - 'tools/configure-google-oauth.py'
      - 'tools/test_configure_google_oauth.py'
      - 'tools/nori-release.py'
      - 'tools/nori-version.py'
      - '.github/workflows/build-webos.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      release-version:
        description: Gemeinsame Nori-Version des Releases
        type: string
        required: true
    outputs:
      asset:
        description: Dateiname des geprüften Pakets
        value: ${{ jobs.build.outputs.asset }}
      sha256:
        description: Prüfsumme des geprüften Pakets
        value: ${{ jobs.build.outputs.sha256 }}

# Im Release eine eigene Gruppe je Lauf — Begründung in build-ios.yml.
concurrency:
  group: ${{ inputs.release-version && format('nori-release-{0}-webos', github.run_id) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ !inputs.release-version }}

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20
    outputs:
      asset: ${{ steps.meta.outputs.asset }}
      sha256: ${{ steps.release-check.outputs.sha256 }}
    env:
      RELEASE_VERSION: ${{ inputs.release-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Gemeinsame Version und Dateiname aus dem Commit. Im Release muss die
      # Nummer die bestätigte sein; ein Testpaket trägt den Commit im Namen.
      - name: Version prüfen
        id: meta
        run: python3 tools/nori-release.py meta --platform webos --release-version "$RELEASE_VERSION" --github-output

      # Node ist auf dem Runner nicht garantiert und soll auch nicht in einer
      # Version festhängen, die zufällig dort liegt.
      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Der geteilte Kern zuerst: er ist die Abhängigkeit der beiden anderen
      # Pakete, und seine Tests prüfen dieselben HTML-Ausschnitte wie die
      # Swift-Tests unter native/Tests.
      - name: Kern bauen und prüfen
        working-directory: shared/nori-core
        run: |
          npm install --no-audit --no-fund
          npm test

      # Der Server bringt eigene Tests mit: die Umschreibung der HLS-Playlisten
      # und die Pfadprüfung von `/api/tmdb` sind sicherheitsrelevant und wären
      # sonst nur auf dem Gerät zu merken.
      - name: Nori-Server übersetzen und prüfen
        working-directory: services/nori-api
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm test

      # Die Werkzeuge, die gleich Zugangsdaten schreiben und das Paket prüfen,
      # werden vorher selbst geprüft — mit erfundenen Werten.
      - name: Prüfwerkzeuge für Google-Zugangsdaten testen
        run: |
          python3 tools/test_check_webos_package.py
          python3 tools/test_configure_google_oauth.py

      # Zwei Builds aus demselben Stand.
      #
      # Der Fernbedienungslauf prüft ausdrücklich „kein Google-Zugang im
      # Build" und läuft deshalb gegen einen Build mit **leeren**
      # TV-Variablen — so, wie ihn jeder Entwickler ohne Zugangsdaten bekommt.
      # Das ausgelieferte Paket entsteht danach mit den produktiven Werten, und
      # `check-webos-package.py --reference-dist` belegt, dass es sich von
      # diesem getesteten Build nur an genau den beiden Werten unterscheidet.
      - name: webOS-App für den Fernbedienungslauf bauen (ohne Google-Zugang)
        working-directory: apps/webos
        env:
          VITE_NORI_GOOGLE_TV_CLIENT_ID: ""
          VITE_NORI_GOOGLE_TV_CLIENT_SECRET: ""
        run: |
          rm -f .env.local
          npm install --no-audit --no-fund
          npm run build

      # Der Fernbedienungslauf.
      #
      # Playwright ist bewusst **keine** Abhängigkeit von `apps/webos`: wer an
      # der Swift-Seite arbeitet, soll für ein `npm install` keinen Browser
      # herunterladen. In der CI wird es deshalb hier einzeln geholt; der
      # Browser liegt danach im Cache des Runners und wird nicht jedes Mal neu
      # geladen.
      #
      # `--no-save` hält es aus der package.json heraus, und der Nachbau des
      # Nori-Servers (`npm run mock`) läuft im Hintergrund — der Lauf braucht
      # weder Internet noch einen TMDB-Schlüssel.
      - name: Fernbedienung durchspielen
        working-directory: apps/webos
        run: |
          npm i playwright --no-save --no-audit --no-fund
          npx playwright install chromium
          npm run mock &
          MOCK=$!
          # Dem Nachbau einen Moment geben, bevor der Browser startet.
          until curl -sf http://127.0.0.1:8799/api/health > /dev/null; do sleep 1; done
          set +e
          npm run test:tv
          STATUS=$?
          set -e
          kill "$MOCK" 2>/dev/null || true
          exit "$STATUS"

      # Nur bei einem Fehlschlag: Bildschirmfotos sind Diagnose, nicht
      # Ergebnis. Am 17.09. hat ihr Hochladen auf einem grünen Lauf das
      # Artefakt-Kontingent gesprengt und damit Paket und Referenzvergleich
      # übersprungen. `if: failure()` statt `continue-on-error`, das in einem
      # Paket-Job nicht vorkommen darf.
      - name: Bildschirmfotos ablegen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Nori-webOS-Screenshots
          path: apps/webos/test-shots/*.png
          if-no-files-found: warn
          retention-days: 3

      - name: Getesteten Build zum Vergleich ablegen
        run: |
          rm -rf "$RUNNER_TEMP/webos-dist-tested"
          cp -R apps/webos/dist "$RUNNER_TEMP/webos-dist-tested"

      # Das installierbare Paket braucht den produktiven TV-Client. Er liegt auf
      # dem Runner außerhalb des Repositorys unter
      # ~/.config/nori/secrets/google-webos-oauth.json, neben den Zugangsdaten
      # der anderen Plattformen. Dasselbe Werkzeug wie am Entwicklerrechner
      # schreibt daraus die nicht eingecheckte apps/webos/.env.local (0600) und
      # meldet nur „configured" — nie einen Wert. Fehlt die Datei oder ist sie
      # ungültig, bricht der Lauf hier ab, bevor ein Paket entsteht.
      # `configure-google-oauth.py` **behält** vorhandene Zeilen in
      # `.env.local` — am Entwicklerrechner richtig, hier nicht: Der Runner ist
      # self-hosted, sein Arbeitsverzeichnis überlebt den Lauf, und ein
      # abgebrochener Lauf kommt nicht mehr bis zum Aufräumen am Ende. Was dann
      # liegenbleibt, landet im produktiven Build — aber nicht im
      # Vergleichsbuild, der die Datei vorher löscht. Der Referenzvergleich
      # meldet das als „unterscheidet sich über die Zugangsdaten hinaus", ohne
      # sagen zu können, woran es liegt.
      #
      # Deshalb: erst weg, dann schreiben. Und die vorhandenen Schlüssel
      # nennen, damit ein nächster Fall nicht wieder geraten werden muss —
      # Namen, nie Werte.
      - name: Google-TV-OAuth bereitstellen
        run: |
          if [ -f apps/webos/.env.local ]; then
            echo "Übrig gebliebene .env.local, Schlüssel:"
            sed -n 's/^\([A-Za-z_][A-Za-z0-9_]*\)=.*/  \1/p' apps/webos/.env.local
            rm -f apps/webos/.env.local
          fi
          python3 tools/configure-google-oauth.py --webos

      - name: webOS-App produktiv bauen
        working-directory: apps/webos
        run: npm run build

      - name: Paket schnüren
        working-directory: apps/webos
        run: |
          rm -f ./*.ipk
          npm run webos:package

      # Das fertige .ipk selbst, entpackt: Version, Quelltext, genau die
      # produktive TV-Client-ID und das Secret, keine iOS-/macOS- oder
      # Test-Zugangsdaten, keine Tokens, keine .env, keine OAuth-JSON — und
      # derselbe Stand wie der getestete Build.
      - name: Paket prüfen
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          python3 tools/check-webos-package.py --production \
            --ipk "apps/webos/tv.nori.app_${VERSION}_all.ipk" \
            --reference-dist "$RUNNER_TEMP/webos-dist-tested"

      # Unter dem gemeinsamen Namen `Nori-webOS-v<VERSION>.ipk` ablegen und
      # noch einmal prüfen: Version und Paketname im Paket, keine .env, keine
      # fremden Zugangsdaten — und die Prüfsumme genau dieser Datei. Der
      # Release veröffentlicht nur ein .ipk mit derselben Prüfsumme, also nie
      # den Build ohne Google-Zugang aus dem Fernbedienungslauf.
      - name: Paket für den Release prüfen
        id: release-check
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          ASSET: ${{ steps.meta.outputs.asset }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/nori-webos"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp "apps/webos/tv.nori.app_${VERSION}_all.ipk" "$OUT/$ASSET"
          echo "path=$OUT/$ASSET" >> "$GITHUB_OUTPUT"
          python3 tools/nori-release.py verify --asset webos --file "$OUT/$ASSET" \
            --release-version "$RELEASE_VERSION" --github-output

      # Im Release die Übergabe an den Release-Job: ein Tag, und sie **muss**
      # gelingen — ohne Paket kein Release.
      - name: Paket als Artefakt ablegen
        if: ${{ inputs.release-version }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: ${{ steps.release-check.outputs.path }}
          if-no-files-found: error
          retention-days: ${{ steps.meta.outputs.retention }}
          overwrite: true

      # Ohne Release nur ein Testpaket zum Herunterladen, drei Tage. Es darf
      # den Lauf nicht kippen: Ist der Artefakt-Speicher des Repositorys voll,
      # scheitert jedes Hochladen mit „Artifact storage quota has been hit" —
      # am 17.09. mehrfach passiert, während Build, Fernbedienungslauf und
      # Paketprüfung grün waren. Dieselbe Überlegung wie bei den
      # Bildschirmfotos: ein Diagnoseschritt verdeckt nicht die Prüfung.
      #
      # `continue-on-error` steht ausdrücklich nur hier, an einem Schritt, der
      # im Release gar nicht läuft. Dort bleibt jeder Schritt zwingend, und
      # `tools/test_nori_release.py` prüft genau das.
      - name: Testpaket ablegen
        if: ${{ !inputs.release-version }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: ${{ steps.release-check.outputs.path }}
          if-no-files-found: error
          retention-days: ${{ steps.meta.outputs.retention }}
          overwrite: true

      # Zugangsdaten verlassen den Runner nur im hochgeladenen Paket. Die
      # .env.local, der produktive Build und das Paket bleiben nicht im
      # Arbeitsverzeichnis liegen.
      - name: Zugangsdaten aus dem Checkout entfernen
        if: always()
        run: |
          rm -f apps/webos/.env.local
          rm -rf apps/webos/dist "$RUNNER_TEMP/webos-dist-tested" "$RUNNER_TEMP/nori-webos"
          rm -f apps/webos/*.ipk

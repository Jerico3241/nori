name: Build webOS

# Läuft auf demselben self-hosted Mac wie alle anderen Läufe. Bei einem
# privaten Repository zählt eine GitHub-Minute — genau daran war das Kontingent
# schon einmal aufgebraucht.
#
# Folgen davon: der Mac muss an und online sein, sonst warten die Jobs. Und es
# gibt nur einen Runner, die Jobs laufen also nacheinander — deshalb die
# concurrency-Gruppe, die überholte Läufe abbricht, statt sie abzuarbeiten.
#
# Anders als die Swift-Läufe braucht dieser hier kein Xcode, nur Node. Er ist
# damit der einzige Lauf des Projekts, der eine Änderung tatsächlich
# durchbauen und testen kann, statt sie nur statisch zu prüfen.
on:
  push:
    paths:
      - 'apps/webos/**'
      - 'shared/nori-core/**'
      - 'services/nori-api/**'
      - 'tools/check-webos-package.py'
      - '.github/workflows/build-webos.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Node ist auf dem Runner nicht garantiert und soll auch nicht in einer
      # Version festhängen, die zufällig dort liegt.
      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Der geteilte Kern zuerst: er ist die Abhängigkeit der beiden anderen
      # Pakete, und seine Tests prüfen dieselben HTML-Ausschnitte wie die
      # Swift-Tests unter native/Tests.
      - name: Kern bauen und prüfen
        working-directory: shared/nori-core
        run: |
          npm install --no-audit --no-fund
          npm test

      # Der Server bringt eigene Tests mit: die Umschreibung der HLS-Playlisten
      # und die Pfadprüfung von `/api/tmdb` sind sicherheitsrelevant und wären
      # sonst nur auf dem Gerät zu merken.
      - name: Nori-Server übersetzen und prüfen
        working-directory: services/nori-api
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm test

      - name: webOS-App bauen
        working-directory: apps/webos
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Paket schnüren
        working-directory: apps/webos
        run: npm run webos:package

      # Der Fernbedienungslauf.
      #
      # Playwright ist bewusst **keine** Abhängigkeit von `apps/webos`: wer an
      # der Swift-Seite arbeitet, soll für ein `npm install` keinen Browser
      # herunterladen. In der CI wird es deshalb hier einzeln geholt; der
      # Browser liegt danach im Cache des Runners und wird nicht jedes Mal neu
      # geladen.
      #
      # `--no-save` hält es aus der package.json heraus, und der Nachbau des
      # Nori-Servers (`npm run mock`) läuft im Hintergrund — der Lauf braucht
      # weder Internet noch einen TMDB-Schlüssel.
      - name: Fernbedienung durchspielen
        working-directory: apps/webos
        run: |
          npm i playwright --no-save --no-audit --no-fund
          npx playwright install chromium
          npm run mock &
          MOCK=$!
          # Dem Nachbau einen Moment geben, bevor der Browser startet.
          until curl -sf http://127.0.0.1:8799/api/health > /dev/null; do sleep 1; done
          set +e
          npm run test:tv
          STATUS=$?
          set -e
          kill "$MOCK" 2>/dev/null || true
          exit "$STATUS"

      - name: Bildschirmfotos ablegen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nori-webOS-Screenshots
          path: apps/webos/test-shots/*.png
          if-no-files-found: warn
          retention-days: 14

      # Prüft Quelltext und fertiges .ipk auf fremde Namen und Adressen und
      # validiert appinfo.json.
      - name: Paket prüfen
        run: python3 tools/check-webos-package.py

      - name: Paket als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: Nori-webOS
          path: apps/webos/*.ipk
          if-no-files-found: error
          retention-days: 30

<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"/>
  <title>Nori</title>
  <style>
    html, body { height: 100%; margin: 0; background: #05060a; color: #eef1f6; font-family: "Segoe UI", system-ui, sans-serif; }
    main { min-height: 100%; display: grid; place-items: center; text-align: center; }
    /* Das App-Symbol selbst. Die Rundung ist die Fensterdarstellung,
       nicht Teil des Bildes. */
    .mark {
      width: 2.4rem; height: 2.4rem; margin: 0 auto 14px; display: block;
      border-radius: 9px; object-fit: cover;
      animation: rise 480ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    h1 {
      font-family: Georgia, "Times New Roman", serif; font-weight: 500; letter-spacing: -0.03em;
      margin: 0 0 16px; font-size: 36px;
      animation: rise 520ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .bar { width: 180px; height: 3px; margin: 0 auto; background: #141822; border-radius: 99px; overflow: hidden; }
    .bar > span { display: block; height: 100%; width: 40%; background: #d7deea; animation: slide 1.1s ease-in-out infinite; }
    p { color: #8b93a7; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; margin: 14px 0 0; }
    @keyframes slide { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }
    @keyframes rise {
      from { opacity: 0; filter: blur(6px); transform: translateY(10px); }
      to { opacity: 1; filter: blur(0); transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .mark, h1 { animation: none; }
      .bar > span { animation: none; width: 40%; }
    }
  </style>
</head>
<body>
  <main>
    <div>
      <img class="mark" src="icon.png" alt="" />
      <h1>Nori</h1>
      <div class="bar"><span></span></div>
      <p>Startet</p>
    </div>
  </main>
</body>
</html>

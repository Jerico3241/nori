android.useAndroidX=true
kotlin.code.style=official
# Nur arm64: der Swift-Kern wird für aarch64-unknown-linux-android28 gebaut,
# und jede weitere ABI hieße, die ganze Swift-Laufzeit noch einmal ins APK zu
# legen — rund 10 MB je Architektur, ohne Gegenwert auf einem Testgerät.
android.defaultConfig.ndk.abiFilters=arm64-v8a

# Kotlin ohne eigenen Compiler-Daemon übersetzen.
#
# Der Daemon kam auf diesem Rechner nicht hoch („Failed connecting to the
# daemon in 4 retries") und fraß 36 Minuten in Wiederholungsversuchen, bevor
# der Build abbrach — ohne eine einzige Zeile Kotlin übersetzt zu haben.
# In-Process braucht mehr Heap im Gradle-Prozess, dafür gibt es keinen
# zweiten Prozess, der sich nicht verbinden kann.
kotlin.compiler.execution.strategy=in-process
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

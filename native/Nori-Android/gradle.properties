org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# Nur arm64: der Swift-Kern wird für aarch64-unknown-linux-android28 gebaut,
# und jede weitere ABI hieße, die ganze Swift-Laufzeit noch einmal ins APK zu
# legen — rund 10 MB je Architektur, ohne Gegenwert auf einem Testgerät.
android.defaultConfig.ndk.abiFilters=arm64-v8a

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
# Der Kern kommt als vorgebaute .so aus SwiftPM. AGP soll sie unverändert
# einpacken und nicht wegstrippen — Debugsymbole der Swift-Laufzeit sind
# groß, aber ein falsch gestripptes libswiftCore.so lädt nicht mehr.
android.native.buildOutput=verbose

kotlin.code.style=official
